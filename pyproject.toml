[project]
name = "susurros"
version = "0.3.0"
description = "Local voice dictation for Windows, macOS and Linux: hold a key, speak, and the clean text appears wherever you are typing."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6-Essentials>=6.7",
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "anthropic",
    "keyring>=25",
    "nvidia-cublas-cu12<=12.9.2.10; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<=9.28.1.4; sys_platform == 'win32'",
    # macOS: the system frameworks (keyboard, permissions, sounds) and the Apple Silicon speech engine
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# Linux with an NVIDIA card: the GPU libraries (the installer adds them when it finds the card).
gpu = [
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]

[project.gui-scripts]
susurros = "susurros.__main__:main"

[project.scripts]
susurros-cli = "susurros.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
package = ["pyinstaller>=6.11"]   # builds the macOS app (see packaging/macos)

[tool.uv]
# mlx-whisper lists torch, but only its model conversion script uses it: a large download for nothing.
override-dependencies = ["torch; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/susurros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
