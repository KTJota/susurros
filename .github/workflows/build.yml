# Tests Susurros on Windows and macOS and builds what each release ships:
# a zip with the installer for Windows, a disk image with the app for macOS.
# Started by hand (Actions > Build > Run workflow); scripts/publish-release.sh turns a
# finished run into the two GitHub releases.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        # The CUDA libraries are over a gigabyte and no test needs a GPU.
        run: uv sync --no-install-package nvidia-cublas-cu12 --no-install-package nvidia-cudnn-cu12
      - name: Test
        run: uv run --no-sync pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        shell: bash
        run: |
          version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          git archive --format=zip --prefix="Susurros-$version/" -o "Susurros-$version-windows.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Susurros-*-windows.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15   # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --group package
      - name: Test
        run: uv run --no-sync pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the app
        run: sh packaging/macos/build.sh
      - name: Check that the packaged app transcribes
        timeout-minutes: 10
        env:
          SUSURROS_MODEL: tiny
          SUSURROS_LANGUAGE: en
        run: |
          mkdir -p smoke
          say -o smoke/speech.wav --file-format=WAVE --data-format=LEI16@16000 "The quick brown fox jumps over the lazy dog."
          dist/Susurros.app/Contents/MacOS/Susurros --cli transcribe smoke/speech.wav | tee smoke/transcribe.txt
          grep -qi "fox" smoke/transcribe.txt
      - name: Check that the packaged app starts
        timeout-minutes: 10
        env:
          SUSURROS_MODEL: tiny
        run: dist/Susurros.app/Contents/MacOS/Susurros --cli smoke smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-checks
          path: smoke
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Susurros-*-macos-arm64.dmg
          if-no-files-found: error
