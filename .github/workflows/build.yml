# Tests Susurros on Windows, macOS and Linux and builds what each release ships: a setup
# program for Windows, a disk image for macOS and a source archive with its installer for Linux.
# Started by hand (Actions > Build > Run workflow). With "release" ticked, each system's files
# are attached to a draft release; scripts/publish-release.sh makes the drafts public.
name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the builds to draft releases
        type: boolean
        default: false
      systems:
        description: Which systems to build
        type: choice
        options: [all, windows, macos, linux]
        default: all

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  SUSURROS_MODEL: tiny   # for the checks that start the app: a model that downloads in seconds

jobs:
  windows:
    if: inputs.systems == 'all' || inputs.systems == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --group package
      - name: Test
        run: uv run --no-sync pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the app and its setup program
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - name: Check that the packaged app starts
        timeout-minutes: 10
        run: |
          $run = Start-Process dist\Susurros\Susurros.exe -ArgumentList "--cli", "smoke", "smoke" -Wait -PassThru
          Get-Content smoke\report.txt
          if ($run.ExitCode -ne 0) { exit 1 }
      - name: Package the source with the script installer
        shell: bash
        run: |
          version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          git archive --format=zip --prefix="Susurros-$version/" -o "dist/Susurros-$version-windows.zip" HEAD
          ls -l dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: smoke
      - name: Attach to a draft release
        if: inputs.release
        shell: bash
        run: |
          gh release view "v$VERSION-windows" >/dev/null 2>&1 || gh release create "v$VERSION-windows" --draft \
            --target "$GITHUB_SHA" --title "Susurros $VERSION for Windows" --notes-file packaging/release-notes/windows.md
          gh release upload "v$VERSION-windows" "dist/Susurros-Setup-$VERSION.exe" "dist/Susurros-$VERSION-windows.zip" --clobber

  macos:
    if: inputs.systems == 'all' || inputs.systems == 'macos'
    runs-on: macos-15   # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --group package
      - name: Test
        run: uv run --no-sync pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the app
        run: sh packaging/macos/build.sh
      - name: Check that the packaged app transcribes
        timeout-minutes: 10
        env:
          SUSURROS_LANGUAGE: en
        run: |
          mkdir -p smoke
          say -o smoke/speech.wav --file-format=WAVE --data-format=LEI16@16000 "The quick brown fox jumps over the lazy dog."
          dist/Susurros.app/Contents/MacOS/Susurros --cli transcribe smoke/speech.wav | tee smoke/transcribe.txt
          grep -qi "fox" smoke/transcribe.txt
      - name: Check that the packaged app starts
        timeout-minutes: 10
        run: dist/Susurros.app/Contents/MacOS/Susurros --cli smoke smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-checks
          path: smoke
      - name: Attach to a draft release
        if: inputs.release
        run: |
          version=$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          gh release view "v$version-macos" >/dev/null 2>&1 || gh release create "v$version-macos" --draft \
            --target "$GITHUB_SHA" --title "Susurros $version for macOS" --notes-file packaging/release-notes/macos.md
          gh release upload "v$version-macos" "dist/Susurros-$version-macos-arm64.dmg" --clobber

  linux:
    if: inputs.systems == 'all' || inputs.systems == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the way a user would
        run: bash scripts/install-linux.sh
      - name: Test
        # Through sudo -u, which starts a session that already has the `input` group the
        # installer added (a user gets it by logging out and back in).
        run: |
          sudo apt-get install -y -qq xvfb
          sudo modprobe uinput || true
          ls -l /dev/uinput /dev/input || true
          export PATH="$HOME/.local/bin:$PATH"
          uv sync
          sudo -E -u "$USER" env "PATH=$PATH" QT_QPA_PLATFORM=offscreen uv run --no-sync pytest -q -rs
      - name: Check that the installed app starts
        timeout-minutes: 10
        run: |
          sudo -E -u "$USER" env "PATH=$PATH" xvfb-run -a "$HOME/.local/share/susurros/venv/bin/python" -m susurros --cli smoke smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-checks
          path: smoke
      - name: Attach to a draft release
        if: inputs.release
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          git archive --format=tar.gz --prefix="Susurros-$version/" -o "Susurros-$version-linux.tar.gz" HEAD
          gh release view "v$version-linux" >/dev/null 2>&1 || gh release create "v$version-linux" --draft \
            --target "$GITHUB_SHA" --title "Susurros $version for Linux" --notes-file packaging/release-notes/linux.md
          gh release upload "v$version-linux" "Susurros-$version-linux.tar.gz" --clobber
